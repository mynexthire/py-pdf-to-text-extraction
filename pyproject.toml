[project]
name = "pdfExtractor"
version = "0.1.0"
description = "PDF extraction wrapper built on PyMuPDF"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.2,<2.0.0",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
